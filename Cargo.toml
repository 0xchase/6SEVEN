[workspace]
resolver = "3"
members = [
	"analyze",
	"cli",
	"core",
	"formats",
	"tga",
	"link",
	"profile",
	"probe",
	"scan",
	"plugins",
]

[workspace.dependencies]
anyhow        = "1"
thiserror     = "1"
serde         = { version = "1", features = ["derive"] }
serde_json    = "1"
clap = "4.5.39"
# Candle 0.6 requires this exact rand version.
rand = "=0.8.5"

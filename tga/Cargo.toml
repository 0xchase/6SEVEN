[package]
name = "tga"
version = "0.1.0"
edition = "2024"

[dependencies]
sixseven-core = { path = "../core" }
rand.workspace = true
rand_chacha = { version = "0.3", optional = true }
serde.workspace = true
bincode = "1.3"
ipnet = { version = "2.9", features = ["serde"] }
# Enable bincode v2 serde support for Burn dependencies.
bincode_v2 = { package = "bincode", optional = true, version = "2.0.1", features = ["serde"] }
# Candle ML framework
candle-core = { version = "0.9", optional = true }
candle-nn = { version = "0.9", optional = true }
serde_json = { workspace = true }
clap = { workspace = true, features = ["derive"] }
tracing = "0.1"
rayon = "1.8"
slab = "0.4"
ndarray = "0.15"
linfa = "0.7"
linfa-clustering = "0.7"
linfa-hierarchical = "0.7"
linfa-kernel = "0.7"
kodama = "0.2"
thiserror.workspace = true

burn = { optional = true, version = "0.19.1", default-features = false, features = ["std", "ndarray", "autodiff"] }

[features]
default = []
ml = ["dep:rand_chacha", "dep:burn", "dep:candle-core", "dep:candle-nn", "dep:bincode_v2"]
gpu = ["ml", "burn/wgpu"]

[package]
name = "sixseven"
version = "0.1.0"
edition = "2024"

[dependencies]
tempfile = "3.8"
sixseven-plugins = { path = "../plugins" }

clap = { workspace = true, features = ["derive"] }
rand = "0.8"
ipnet = { version = "2.9", features = ["serde"] }
indicatif = { version = "0.17.7", features = ["rayon"]}
base64 = "0.22.1"

# Tracing dependencies
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "local-time"] }
tracing-indicatif = "0.3"
time = { version = "0.3", features = ["macros", "formatting"] }
tracing-appender = "0.2"
csv = "1.3"
plotters = { version = "0.3", default-features = false, features = ["ttf", "fontconfig-dlopen", "bitmap_backend", "bitmap_encoder"] }

sixseven-core = { path = "../core" }
tga = { path = "../tga" }
analyze = { path = "../analyze" }
scan = { path = "../scan" }
probe = { path = "../probe" }
link = { path = "../link" }
sixseven-formats = { path = "../formats" }
comfy-table = "7.1.4"
rayon = "1.10.0"

tokio = { version = "1.0", features = ["macros", "rt-multi-thread", "sync", "time", "fs", "io-util"] }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }

[features]
default = []
ml = ["tga/ml"]
gpu = ["ml", "tga/gpu"]

[[bin]]
name = "6seven"
path = "src/main.rs"

[dev-dependencies]
